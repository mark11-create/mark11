<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bounce Text + Redirect Button</title>

<style>
body{
  background:#55eaf7;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  overflow:hidden;
}

/* ===== HELLO TEXT ===== */
h1{
  display:flex;
  gap:12px;
}

span{
  position:relative;
  font-size:5rem;
  font-family:sans-serif;
  color:#fff;
  display:inline-block;
  animation:bounce 1.6s infinite;
}

/* SHADOW */
span::after{
  content:"";
  position:absolute;
  top:100%;
  left:50%;
  width:80%;
  height:10px;
  background:rgba(0,0,0,.35);
  border-radius:50%;
  transform:translateX(-50%);
  filter:blur(6px);
  animation:shadow 1.6s infinite;
}

/* WAVE DELAY */
span:nth-child(1){animation-delay:0s}
span:nth-child(2){animation-delay:.12s}
span:nth-child(3){animation-delay:.24s}
span:nth-child(4){animation-delay:.36s}
span:nth-child(5){animation-delay:.48s}
span:nth-child(6){animation-delay:.6s}

span:nth-child(1)::after{animation-delay:0s}
span:nth-child(2)::after{animation-delay:.12s}
span:nth-child(3)::after{animation-delay:.24s}
span:nth-child(4)::after{animation-delay:.36s}
span:nth-child(5)::after{animation-delay:.48s}
span:nth-child(6)::after{animation-delay:.6s}

/* BOUNCE */
@keyframes bounce{
  0%{transform:translateY(0) scale(1)}
  20%{transform:translateY(0) scaleX(1.1) scaleY(.9)}
  40%{transform:translateY(-45px) scaleX(.95) scaleY(1.05)}
  60%{transform:translateY(0) scaleX(1.05) scaleY(.95)}
  75%{transform:translateY(-15px) scale(1)}
  100%{transform:translateY(0) scale(1)}
}

@keyframes shadow{
  0%,100%{transform:translateX(-50%) scale(1);opacity:.35}
  40%{transform:translateX(-50%) scale(.6);opacity:.1}
}

/* ===== RED GLOW BUTTON ===== */
.glow-btn{
  --primary: 270;
  position:fixed;
  bottom:24px;
  right:24px;
  padding:14px 38px;
  font-size:16px;
  color:#fff;
  background:#111;
  border:none;
  border-radius:50px;
  cursor:pointer;
  overflow:hidden;
  isolation:isolate;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.glow-btn .inner{
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      120px circle at var(--x) var(--y),
      hsl(var(--primary) 100% 60% / .6),
      transparent 60%
    );
  opacity:0;
  transition:opacity .3s;
  z-index:-1;
}

.glow-btn:hover .inner{
  opacity:1;
}

.glow-btn:hover{
  box-shadow:
    0 0 25px hsl(var(--primary) 100% 60% / .5),
    0 0 60px hsl(var(--primary) 100% 60% / .3);
}
</style>
</head>

<body>

<h1>
  <span>H</span>
  <span>E</span>
  <span>L</span>
  <span>L</span>
  <span>O</span>
  <span>!</span>
</h1>

<button class="glow-btn" onclick="goToSite()">
  <span class="inner"></span>
  Get started
</button>

<script>
const btn = document.querySelector(".glow-btn");

btn.addEventListener("mousemove", e => {
  const rect = btn.getBoundingClientRect();
  btn.style.setProperty("--x", e.clientX - rect.left + "px");
  btn.style.setProperty("--y", e.clientY - rect.top + "px");
});

function goToSite(){
  window.location.href =
  "https://loginpagemeltai.netlify.app";
}
</script>

</body>
</html>
